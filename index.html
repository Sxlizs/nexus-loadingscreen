<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Nexus Projekt | SCP:RP</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="backgroundA" class="background-layer background-active"></div>
    <div id="backgroundB" class="background-layer"></div>
    <div class="background-overlay"></div>

    <main class="loading-screen">
        <header class="header">
            <div class="brand">
                <div class="logo"><img src="logo.png" alt="Nexus Projekt"></div>
                <div>
                    <div class="title">NEXUS PROJEKT</div>
                    <div class="subtitle">SCP:RP <span>•</span> ROLEPLAY SERVER</div>
                </div>
            </div>
        </header>

        <nav class="tabs" aria-label="Informationen">
            <button class="tab active" data-tab="welcome" type="button">WILLKOMMEN</button>
            <button class="tab" data-tab="team" type="button">TEAM</button>
            <button class="tab" data-tab="project" type="button">PROJEKT</button>
        </nav>

        <section class="card">
            <section id="welcome" class="tab-content active">
                <div class="welcome welcome-stack">
                    <h1 class="welcome-title">WILLKOMMEN AUF</h1>
                    <img class="welcome-banner" src="welcome.png" alt="Welcome Banner">
                    <h2 class="welcome-project">PROJEKT SCP:RP</h2>
                </div>
            </section>

            <section id="team" class="tab-content">
                <div class="team-heading">
                    <span>SERVER TEAM</span>
                </div>
                <div id="staffGrid" class="staff-grid">
                    <div class="staff-loading">Team wird geladen...</div>
                </div>
            </section>

            <section id="project" class="tab-content">
                <div class="info-grid">
                    <div><span>ERSTELLUNGSDATUM</span><strong>20.09.2026</strong></div>
                    <div><span>GAMEMODE</span><strong id="gamemode">SCP:RP</strong></div>
                    <div><span>SERVER</span><strong id="serverName">NEXUS PROJEKT | SCP:RP</strong></div>
                    <div><span>MAP</span><strong id="mapName">LADEN...</strong></div>
                    <div><span>SLOTS</span><strong id="maxPlayers">--</strong></div>
                </div>
            </section>
        </section>

        <footer class="footer">
            <div class="progress-area">
                <div class="progress-text"><span id="progressLabel">VERBINDEN</span><span id="progressPercent">0%</span>
                </div>
                <div class="progress-track">
                    <div id="progressBar"></div>
                </div>
                <div id="downloadText" class="download-text">Serververbindung wird vorbereitet...</div>
            </div>
        </footer>
    </main>

    <script src="script.js"></script>
</body>

</html>
